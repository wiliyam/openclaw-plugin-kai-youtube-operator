name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Project quality rules
        run: npm run quality

      - name: Lint GitHub workflows
        shell: bash
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate OpenClaw plugin
        run: npm run plugin:validate

      - name: Production dependency audit
        run: npm run security:prod

      - name: Verify generated files are committed
        run: git diff --exit-code -- dist openclaw.plugin.json package.json package-lock.json
